  <style>
    .vb-jv1,
    .vb-jv1 * { box-sizing: border-box; }
    .vb-jv1 input,
    .vb-jv1 textarea,
    .vb-jv1 select { font: inherit; }

    .vb-jv1 {
      --vb-jv1-bg: #04090f;
      --vb-jv1-bg-soft: rgba(10, 26, 38, .72);
      --vb-jv1-line: rgba(55, 226, 255, .22);
      --vb-jv1-line-strong: rgba(55, 226, 255, .45);
      --vb-jv1-accent: #37e2ff;
      --vb-jv1-accent-soft: rgba(55, 226, 255, .14);
      --vb-jv1-warn: #ffb648;
      --vb-jv1-danger: #ff4d5e;
      --vb-jv1-text: #d9edf6;
      --vb-jv1-muted: #8fb4c8;
      --vb-jv1-z-toast: 40;
      --vb-jv1-z-modal: 50;
      --vb-jv1-z-voice: 60;
      --vb-jv1-z-boot: 70;

      position: relative;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 330px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "top top top"
        "nav stage side"
        "nav console console";
      gap: 14px;
      min-height: 640px;
      height: 100vh;
      padding: 14px;
      background: var(--vb-jv1-bg);
      background-image:
        radial-gradient(1100px 480px at 78% -10%, rgba(55, 226, 255, .09), transparent 60%),
        radial-gradient(700px 420px at 0% 100%, rgba(55, 226, 255, .06), transparent 65%),
        linear-gradient(rgba(55, 226, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(55, 226, 255, .045) 1px, transparent 1px);
      background-size: auto, auto, 44px 44px, 44px 44px;
      color: var(--vb-jv1-text);
      font-family: var(--t-text-font, ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace);
      overflow: hidden;
    }
    .vb-jv1::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px);
      opacity: .5;
    }
    .vb-jv1__visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- Кнопки ---------- */
    .vb-jv1-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--vb-jv1-line-strong);
      border-radius: 3px;
      background: var(--vb-jv1-accent-soft);
      color: var(--vb-jv1-accent);
      font-family: var(--t-text-font, ui-monospace, Consolas, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .22s ease-out, color .22s ease-out, border-color .22s ease-out, box-shadow .22s ease-out, transform .12s ease-out;
    }
    .vb-jv1-btn:hover {
      background: rgba(55, 226, 255, .28);
      border-color: var(--vb-jv1-accent);
      box-shadow: 0 0 18px rgba(55, 226, 255, .28);
    }
    .vb-jv1-btn:active { transform: translateY(1px); }
    .vb-jv1-btn:focus-visible,
    .vb-jv1-iconbtn:focus-visible,
    .vb-jv1__nav-btn:focus-visible,
    .vb-jv1-chip:focus-visible,
    .vb-jv1__cam:focus-visible,
    .vb-jv1-suit:focus-visible,
    .vb-jv1-switch:focus-visible {
      outline: 2px solid var(--vb-jv1-warn);
      outline-offset: 2px;
    }
    .vb-jv1-btn[aria-pressed="true"] {
      background: var(--vb-jv1-accent);
      color: #04202b;
      box-shadow: 0 0 22px rgba(55, 226, 255, .45);
    }
    .vb-jv1-btn--ghost { background: transparent; }
    .vb-jv1-btn--warn { border-color: rgba(255, 182, 72, .5); color: var(--vb-jv1-warn); background: rgba(255, 182, 72, .08); }
    .vb-jv1-btn--warn:hover { background: rgba(255, 182, 72, .22); border-color: var(--vb-jv1-warn); box-shadow: 0 0 18px rgba(255, 182, 72, .25); }
    .vb-jv1-btn--warn[aria-pressed="true"] { background: var(--vb-jv1-warn); color: #241300; }
    .vb-jv1-btn--danger { border-color: rgba(255, 77, 94, .55); color: var(--vb-jv1-danger); background: rgba(255, 77, 94, .08); }
    .vb-jv1-btn--danger:hover { background: rgba(255, 77, 94, .24); border-color: var(--vb-jv1-danger); box-shadow: 0 0 18px rgba(255, 77, 94, .3); }
    .vb-jv1-btn--danger[aria-pressed="true"] { background: var(--vb-jv1-danger); color: #2a0409; animation: vb-jv1-blink 1.1s steps(2, start) infinite; }
    .vb-jv1 .t-btnflex { border: 1px solid var(--vb-jv1-line-strong); background: var(--vb-jv1-accent-soft); color: var(--vb-jv1-accent); }
    .vb-jv1 .t-btnflex:hover { background: rgba(55, 226, 255, .28); }
    .vb-jv1 .t-btnflex__icon { display: inline-flex; }
    .vb-jv1 .t-btnflex__icon svg { width: 16px; height: 16px; }

    .vb-jv1-iconbtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--vb-jv1-line-strong);
      border-radius: 3px;
      background: transparent;
      color: var(--vb-jv1-accent);
      cursor: pointer;
      transition: background .2s ease-out, box-shadow .2s ease-out;
    }
    .vb-jv1-iconbtn svg { width: 20px; height: 20px; }
    .vb-jv1-iconbtn:hover { background: var(--vb-jv1-accent-soft); box-shadow: 0 0 14px rgba(55, 226, 255, .25); }
    .vb-jv1-iconbtn[aria-pressed="true"] { background: var(--vb-jv1-accent); color: #04202b; }
    .vb-jv1-iconbtn--sm { width: 34px; height: 34px; }
    .vb-jv1-iconbtn--sm svg { width: 15px; height: 15px; }
    .vb-jv1__sound-wave { transition: opacity .2s; }
    .vb-jv1 #vb-jv1-sound[aria-pressed="false"] .vb-jv1-sound-wave { opacity: .25; }

    /* ---------- Шапка ---------- */
    .vb-jv1__top {
      grid-area: top;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border: 1px solid var(--vb-jv1-line);
      background: var(--vb-jv1-bg-soft);
    }
    .vb-jv1__brand { display: flex; align-items: center; gap: 12px; }
    .vb-jv1__brand-icon { width: 38px; height: 38px; color: var(--vb-jv1-accent); animation: vb-jv1-pulse 3.2s ease-in-out infinite; }
    .vb-jv1__brand-name {
      margin: 0;
      color: var(--vb-jv1-accent);
      font-family: var(--t-headline-font, var(--t-text-font, inherit));
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .22em;
    }
    .vb-jv1__brand-sub { margin: 2px 0 0; color: var(--vb-jv1-muted); font-size: 11px; letter-spacing: .06em; }
    .vb-jv1__top-status { display: flex; gap: 8px; flex-wrap: wrap; }
    .vb-jv1__chip {
      padding: 5px 10px;
      border: 1px solid var(--vb-jv1-line);
      color: var(--vb-jv1-muted);
      font-size: 11px;
      letter-spacing: .1em;
    }
    .vb-jv1__chip--alert { border-color: var(--vb-jv1-danger); color: var(--vb-jv1-danger); animation: vb-jv1-blink 1s steps(2, start) infinite; }
    .vb-jv1__top-right { display: flex; align-items: center; gap: 10px; }
    .vb-jv1__clock { color: var(--vb-jv1-text); font-size: 20px; font-weight: 600; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    .vb-jv1-btn--voice .t-btnflex__text { font-size: 12px; }

    /* ---------- Навигация ---------- */
    .vb-jv1__nav {
      grid-area: nav;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 8px;
      border: 1px solid var(--vb-jv1-line);
      background: var(--vb-jv1-bg-soft);
      align-self: stretch;
    }
    .vb-jv1__nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 4px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--vb-jv1-muted);
      font-family: var(--t-text-font, ui-monospace, Consolas, monospace);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .2s ease-out, border-color .2s ease-out, background .2s ease-out;
    }
    .vb-jv1__nav-btn svg { width: 26px; height: 26px; }
    .vb-jv1__nav-btn:hover { color: var(--vb-jv1-accent); background: var(--vb-jv1-accent-soft); }
    .vb-jv1__nav-btn.is-active {
      color: var(--vb-jv1-accent);
      border-color: var(--vb-jv1-line-strong);
      background: var(--vb-jv1-accent-soft);
      box-shadow: inset 0 0 16px rgba(55, 226, 255, .12);
    }

    /* ---------- Панели ---------- */
    .vb-jv1__stage {
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      display: flex;
    }
    .vb-jv1__panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--vb-jv1-line);
      background: var(--vb-jv1-bg-soft);
      overflow: auto;
    }
    .vb-jv1__panel[hidden] { display: none; }
    .vb-jv1__panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .vb-jv1__panel-title {
      margin: 0;
      color: var(--vb-jv1-accent);
      font-family: var(--t-headline-font, var(--t-text-font, inherit));
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .18em;
      text-wrap: balance;
    }
    .vb-jv1__panel-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* Реактор */
    .vb-jv1__reactor-wrap { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
    .vb-jv1__reactor { width: min(300px, 62vw); aspect-ratio: 1; color: var(--vb-jv1-accent); flex: 0 0 auto; }
    .vb-jv1__reactor svg { width: 100%; height: 100%; overflow: visible; }
    .vb-jv1__ring { transform-origin: 110px 110px; }
    .vb-jv1__ring--a { animation: vb-jv1-spin 26s linear infinite; }
    .vb-jv1__ring--b { animation: vb-jv1-spin-rev 16s linear infinite; }
    .vb-jv1__ring--c { animation: vb-jv1-spin 9s linear infinite; }
    .vb-jv1__ring--d { animation: vb-jv1-spin-rev 30s linear infinite; }
    .vb-jv1__core { filter: drop-shadow(0 0 18px currentColor); }
    .vb-jv1__core-glow { animation: vb-jv1-pulse 2.4s ease-in-out infinite; }
    .vb-jv1__reactor-side { flex: 1 1 240px; min-width: 220px; }
    .vb-jv1__power-value {
      margin: 0;
      color: var(--vb-jv1-accent);
      font-family: var(--t-headline-font, var(--t-text-font, inherit));
      font-size: clamp(46px, 7vw, 74px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 26px rgba(55, 226, 255, .4);
    }
    .vb-jv1__power-unit { font-size: .4em; margin-left: 4px; letter-spacing: .1em; }
    .vb-jv1__power-cap { margin: 4px 0 16px; color: var(--vb-jv1-muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    .vb-jv1__slider-row { display: block; }
    .vb-jv1__slider-name { display: block; margin-bottom: 6px; color: var(--vb-jv1-muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .vb-jv1__slider { width: 100%; appearance: none; -webkit-appearance: none; height: 4px; border-radius: 2px; background: rgba(55, 226, 255, .18); outline-offset: 4px; cursor: pointer; }
    .vb-jv1__slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--vb-jv1-accent); border: 3px solid #04202b; box-shadow: 0 0 12px rgba(55, 226, 255, .7); cursor: grab; }
    .vb-jv1__slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--vb-jv1-accent); border: 3px solid #04202b; box-shadow: 0 0 12px rgba(55, 226, 255, .7); cursor: grab; }
    .vb-jv1__slider--sm { height: 3px; }
    .vb-jv1__stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 18px 0 0; }
    .vb-jv1__stat { padding: 10px 12px; border: 1px solid var(--vb-jv1-line); background: rgba(4, 12, 19, .5); }
    .vb-jv1__stat dt { color: var(--vb-jv1-muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .vb-jv1__stat dd { margin: 4px 0 0; color: var(--vb-jv1-accent); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .vb-jv1__reactor-foot { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; margin-top: auto; }
    .vb-jv1__actions { display: flex; gap: 10px; flex-wrap: wrap; flex: 1 1 280px; }
    .vb-jv1__scope { flex: 2 1 300px; min-width: 240px; }
    .vb-jv1__scope-label { margin: 0 0 6px; color: var(--vb-jv1-muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .vb-jv1__canvas { display: block; width: 100%; border: 1px solid var(--vb-jv1-line); background: rgba(3, 10, 16, .7); }

    /* Камеры */
    .vb-jv1__cams { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .vb-jv1__cam {
      position: relative;
      display: block;
      padding: 0;
      border: 1px solid var(--vb-jv1-line);
      background: #02070c;
      cursor: pointer;
      overflow: hidden;
      transition: border-color .22s ease-out, box-shadow .22s ease-out;
    }
    .vb-jv1__cam:hover { border-color: var(--vb-jv1-line-strong); box-shadow: 0 0 20px rgba(55, 226, 255, .18); }
    .vb-jv1__cam img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; filter: saturate(.55) contrast(1.08) brightness(.82) hue-rotate(-8deg); transition: filter .3s ease-out, transform .5s ease-out; }
    .vb-jv1__cam:hover img { filter: saturate(.8) contrast(1.1) brightness(.95); transform: scale(1.03); }
    .vb-jv1__cam-meta { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; background: linear-gradient(transparent, rgba(2, 8, 13, .92)); color: var(--vb-jv1-text); font-size: 11px; letter-spacing: .08em; }
    .vb-jv1__cam-name { color: var(--vb-jv1-accent); }
    .vb-jv1__cam-rec { position: absolute; top: 8px; left: 10px; color: var(--vb-jv1-danger); font-size: 10px; letter-spacing: .16em; }
    .vb-jv1__cam-rec::before { content: "●"; margin-right: 5px; animation: vb-jv1-blink 1.4s steps(2, start) infinite; }
    .vb-jv1__cams .vb-jv1__cam.is-open { grid-column: 1 / -1; }
    .vb-jv1__cams .vb-jv1__cam.is-open img { aspect-ratio: 21/9; }
    .vb-jv1__cams .vb-jv1__cam.is-open { border-color: var(--vb-jv1-accent); }
    .vb-jv1__hint { margin: 0; color: var(--vb-jv1-muted); font-size: 12px; line-height: 1.5; }

    /* Дроны */
    .vb-jv1__drones { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .vb-jv1__drone { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--vb-jv1-line); background: rgba(4, 12, 19, .5); }
    .vb-jv1__drone.is-flying { border-color: rgba(255, 182, 72, .5); }
    .vb-jv1__drone-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .vb-jv1__drone-name { margin: 0; color: var(--vb-jv1-text); font-family: var(--t-headline-font, var(--t-text-font, inherit)); font-size: 15px; letter-spacing: .12em; }
    .vb-jv1__drone-task { margin: 0; color: var(--vb-jv1-muted); font-size: 12px; line-height: 1.5; }
    .vb-jv1__badge { padding: 3px 8px; border: 1px solid var(--vb-jv1-line-strong); color: var(--vb-jv1-accent); font-size: 10px; letter-spacing: .1em; white-space: nowrap; }
    .vb-jv1__badge--info { border-color: var(--vb-jv1-line); color: var(--vb-jv1-muted); }
    .vb-jv1__badge--warn { border-color: rgba(255, 182, 72, .6); color: var(--vb-jv1-warn); }
    .vb-jv1__badge--muted { border-color: rgba(143, 180, 200, .35); color: var(--vb-jv1-muted); }
    .vb-jv1__badge--danger { border-color: rgba(255, 77, 94, .6); color: var(--vb-jv1-danger); }
    .vb-jv1__badge--air { border-color: rgba(255, 182, 72, .6); color: var(--vb-jv1-warn); }
    .vb-jv1__batt { display: flex; align-items: center; gap: 8px; }
    .vb-jv1__batt-label { color: var(--vb-jv1-muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .vb-jv1__batt-track { flex: 1; height: 6px; background: rgba(55, 226, 255, .14); overflow: hidden; }
    .vb-jv1__batt-fill { display: block; height: 100%; background: var(--vb-jv1-accent); transition: width .6s ease-out; }
    .vb-jv1__batt-num { color: var(--vb-jv1-accent); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
    .vb-jv1__drone-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }

    /* Арсенал */
    .vb-jv1__suits { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .vb-jv1-suit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px 12px 16px;
      border: 1px solid var(--vb-jv1-line);
      background: rgba(4, 12, 19, .5);
      color: var(--vb-jv1-muted);
      font-family: var(--t-text-font, ui-monospace, Consolas, monospace);
      cursor: pointer;
      transition: border-color .22s ease-out, box-shadow .22s ease-out, color .22s ease-out, transform .22s ease-out;
    }
    .vb-jv1-suit svg { width: 56px; height: 56px; color: var(--vb-jv1-accent); opacity: .8; transition: opacity .22s, transform .4s ease-out; }
    .vb-jv1-suit:hover { border-color: var(--vb-jv1-line-strong); box-shadow: 0 0 22px rgba(55, 226, 255, .16); transform: translateY(-3px); color: var(--vb-jv1-text); }
    .vb-jv1-suit:hover svg { opacity: 1; transform: scale(1.06); }
    .vb-jv1-suit__name { color: var(--vb-jv1-text); font-size: 14px; font-weight: 700; letter-spacing: .14em; }
    .vb-jv1-suit__ver { color: var(--vb-jv1-muted); font-size: 11px; letter-spacing: .12em; }
    .vb-jv1-suit__st { margin-top: 4px; }
    .vb-jv1-suit.is-deployed { border-color: var(--vb-jv1-warn); }
    .vb-jv1-suit.is-deployed .vb-jv1-suit__st { border-color: var(--vb-jv1-warn); color: var(--vb-jv1-warn); }

    /* Оборона */
    .vb-jv1__zones { display: flex; flex-direction: column; gap: 12px; }
    .vb-jv1__zone { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border: 1px solid var(--vb-jv1-line); background: rgba(4, 12, 19, .5); }
    .vb-jv1__zone-name { margin: 0; color: var(--vb-jv1-text); font-family: var(--t-headline-font, var(--t-text-font, inherit)); font-size: 15px; letter-spacing: .1em; }
    .vb-jv1__zone-desc { margin: 3px 0 0; color: var(--vb-jv1-muted); font-size: 12px; line-height: 1.4; }
    .vb-jv1-switch { position: relative; width: 52px; height: 26px; flex: 0 0 auto; border: 1px solid var(--vb-jv1-line-strong); border-radius: 14px; background: rgba(4, 12, 19, .8); cursor: pointer; transition: background .22s ease-out, border-color .22s; }
    .vb-jv1-switch span { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--vb-jv1-muted); transition: transform .22s ease-out, background .22s; }
    .vb-jv1-switch.is-on { background: var(--vb-jv1-accent-soft); border-color: var(--vb-jv1-accent); }
    .vb-jv1-switch.is-on span { transform: translateX(26px); background: var(--vb-jv1-accent); box-shadow: 0 0 10px rgba(55, 226, 255, .8); }
    .vb-jv1__defense-foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: auto; }

    /* Аналитика */
    .vb-jv1__metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .vb-jv1__metric { padding: 14px 16px; border: 1px solid var(--vb-jv1-line); background: rgba(4, 12, 19, .5); }
    .vb-jv1__metric-val { margin: 0; color: var(--vb-jv1-accent); font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .vb-jv1__metric-name { margin: 4px 0 0; color: var(--vb-jv1-muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .vb-jv1__chart-wrap { flex: 1; min-height: 200px; display: flex; }
    .vb-jv1__canvas--chart { flex: 1; height: auto; min-height: 200px; }
    .vb-jv1__panel-tools .is-active { background: var(--vb-jv1-accent-soft); border-color: var(--vb-jv1-accent); color: var(--vb-jv1-accent); }

    /* Боковая колонка */
    .vb-jv1__side {
      grid-area: side;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      padding: 16px;
      border: 1px solid var(--vb-jv1-line);
      background: var(--vb-jv1-bg-soft);
      overflow: auto;
    }
    .vb-jv1__side-title { margin: 4px 0 0; color: var(--vb-jv1-muted); font-family: var(--t-headline-font, var(--t-text-font, inherit)); font-size: 11px; font-weight: 700; letter-spacing: .24em; }
    .vb-jv1__gauges { display: flex; flex-direction: column; gap: 10px; }
    .vb-jv1__gauge { display: grid; grid-template-columns: 74px 1fr 38px; align-items: center; gap: 10px; }
    .vb-jv1__gauge-name { color: var(--vb-jv1-muted); font-size: 11px; letter-spacing: .06em; }
    .vb-jv1__gauge-track { height: 6px; background: rgba(55, 226, 255, .13); overflow: hidden; }
    .vb-jv1__gauge-fill { display: block; height: 100%; background: linear-gradient(90deg, rgba(55, 226, 255, .5), var(--vb-jv1-accent)); transition: width .9s ease-out; }
    .vb-jv1__gauge-num { color: var(--vb-jv1-accent); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }

    .vb-jv1__player { padding: 12px; border: 1px solid var(--vb-jv1-line); background: rgba(4, 12, 19, .5); }
    .vb-jv1__track { margin: 0 0 10px; color: var(--vb-jv1-text); font-size: 12px; line-height: 1.4; }
    .vb-jv1__player-row { display: flex; align-items: center; gap: 8px; }
    .vb-jv1__vol { flex: 1; display: flex; align-items: center; min-width: 60px; }
    .vb-jv1__eq { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin-top: 10px; }
    .vb-jv1__eq span { flex: 1; height: 20%; background: var(--vb-jv1-accent); opacity: .75; transition: height .3s ease-out; }
    .vb-jv1__player.is-playing .vb-jv1__eq span { animation: vb-jv1-eq 1s ease-in-out infinite; }
    .vb-jv1__eq span:nth-child(2n) { animation-delay: .15s; }
    .vb-jv1__eq span:nth-child(3n) { animation-delay: .3s; }
    .vb-jv1__eq span:nth-child(4n) { animation-delay: .45s; }

    .vb-jv1__log { flex: 1; min-height: 120px; margin: 0; padding: 10px 12px; border: 1px solid var(--vb-jv1-line); background: rgba(4, 12, 19, .55); list-style: none; overflow-y: auto; font-size: 11.5px; line-height: 1.6; }
    .vb-jv1__log li { display: flex; gap: 8px; color: var(--vb-jv1-text); border-bottom: 1px dashed rgba(55, 226, 255, .12); padding: 3px 0; }
    .vb-jv1__log li:last-child { border-bottom: 0; }
    .vb-jv1__log time { color: var(--vb-jv1-muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .vb-jv1__log .is-warn { color: var(--vb-jv1-warn); }
    .vb-jv1__log .is-danger { color: var(--vb-jv1-danger); }

    /* Консоль */
    .vb-jv1__console {
      grid-area: console;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--vb-jv1-line);
      background: var(--vb-jv1-bg-soft);
    }
    .vb-jv1__console-out { height: 108px; overflow-y: auto; font-size: 12px; line-height: 1.55; }
    .vb-jv1__cline { margin: 0; color: var(--vb-jv1-text); }
    .vb-jv1__cline--sys { color: var(--vb-jv1-muted); }
    .vb-jv1__cline--user { color: var(--vb-jv1-warn); }
    .vb-jv1__cline--err { color: var(--vb-jv1-danger); }
    .vb-jv1__console-form { display: flex; align-items: center; gap: 10px; }
    .vb-jv1__prompt { color: var(--vb-jv1-accent); font-size: 18px; font-weight: 700; }
    .vb-jv1__console-in {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--vb-jv1-line);
      border-radius: 2px;
      background: rgba(3, 10, 16, .8);
      color: var(--vb-jv1-text);
      font-family: var(--t-text-font, ui-monospace, Consolas, monospace);
      font-size: 13px;
      letter-spacing: .04em;
      caret-color: var(--vb-jv1-accent);
    }
    .vb-jv1__console-in::placeholder { color: var(--vb-jv1-muted); opacity: .9; }
    .vb-jv1__console-in:focus { outline: none; border-color: var(--vb-jv1-accent); box-shadow: 0 0 0 1px rgba(55, 226, 255, .35); }
    .vb-jv1__chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .vb-jv1-chip {
      padding: 5px 12px;
      border: 1px dashed var(--vb-jv1-line-strong);
      border-radius: 2px;
      background: transparent;
      color: var(--vb-jv1-muted);
      font-family: var(--t-text-font, ui-monospace, Consolas, monospace);
      font-size: 11px;
      letter-spacing: .06em;
      cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
    }
    .vb-jv1-chip:hover { color: var(--vb-jv1-accent); border-style: solid; background: var(--vb-jv1-accent-soft); }

    /* Тосты */
    .vb-jv1__toasts { position: absolute; top: 76px; right: 22px; z-index: var(--vb-jv1-z-toast); display: flex; flex-direction: column; gap: 10px; width: min(320px, 78vw); pointer-events: none; }
    .vb-jv1-toast {
      padding: 11px 14px;
      border: 1px solid var(--vb-jv1-line-strong);
      background: rgba(5, 17, 26, .95);
      color: var(--vb-jv1-text);
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: .03em;
      box-shadow: 0 6px 26px rgba(0, 0, 0, .5), 0 0 18px rgba(55, 226, 255, .12);
      animation: vb-jv1-toast-in .3s cubic-bezier(.16, 1, .3, 1);
    }
    .vb-jv1-toast--warn { border-color: rgba(255, 182, 72, .6); }
    .vb-jv1-toast--danger { border-color: rgba(255, 77, 94, .65); }
    .vb-jv1-toast.is-out { opacity: 0; transform: translateX(16px); transition: opacity .3s, transform .3s; }

    /* Модальное окно */
    .vb-jv1__modal { position: absolute; inset: 0; z-index: var(--vb-jv1-z-modal); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .vb-jv1__modal[hidden] { display: none; }
    .vb-jv1__modal-bd { position: absolute; inset: 0; background: rgba(2, 6, 10, .78); }
    .vb-jv1__modal-card {
      position: relative;
      width: min(440px, 100%);
      padding: 26px;
      border: 1px solid var(--vb-jv1-line-strong);
      background: #06121c;
