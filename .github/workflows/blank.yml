      /* ---------- График ---------- */
      var chartData = {
        day: { pts: [42, 55, 48, 70, 64, 82, 76, 90, 68, 74, 60, 52], used: '14.2 ГВт·ч', saved: '3.8 ГВт·ч', cost: '−11%' },
        week: { pts: [60, 58, 72, 66, 88, 92, 70, 64, 78, 84, 69, 74], used: '96.4 ГВт·ч', saved: '21.7 ГВт·ч', cost: '−6%' },
        month: { pts: [30, 44, 52, 48, 61, 70, 66, 82, 76, 88, 94, 86], used: '412 ГВт·ч', saved: '88 ГВт·ч', cost: '−3%' }
      };
      var period = 'day';
      var chartAnim = 0;

      function drawChart() {
        var f = fitCanvas(chartCv);
        if (!f) return;
        var ctx = f.ctx, w = f.w, h = f.h;
        var data = chartData[period].pts;
        ctx.clearRect(0, 0, w, h);
        var padL = 34, padB = 22, padT = 12;
        ctx.strokeStyle = 'rgba(55,226,255,.1)';
        ctx.fillStyle = 'rgba(143,180,200,.85)';
        ctx.font = '10px ui-monospace, monospace';
        ctx.lineWidth = 1;
        for (var i = 0; i <= 4; i++) {
          var y = padT + (h - padT - padB) * (i / 4);
          ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - 6, y); ctx.stroke();
          ctx.fillText(String(100 - i * 25), 4, y + 3);
        }
        var max = 100, n = data.length;
        var stepX = (w - padL - 10) / (n - 1);
        var accent = state.alert ? '#ff4d5e' : '#37e2ff';
        var limit = Math.max(2, Math.round(n * Math.min(1, chartAnim)));
        ctx.beginPath();
        ctx.moveTo(padL, h - padB);
        for (var j = 0; j < limit; j++) {
          var x = padL + j * stepX;
          var yv = padT + (h - padT - padB) * (1 - data[j] / max);
          ctx.lineTo(x, yv);
        }
        var lastX = padL + (limit - 1) * stepX;
        ctx.lineTo(lastX, h - padB);
        ctx.closePath();
        var grad = ctx.createLinearGradient(0, padT, 0, h - padB);
        grad.addColorStop(0, 'rgba(55,226,255,.34)');
        grad.addColorStop(1, 'rgba(55,226,255,.02)');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        for (var k = 0; k < limit; k++) {
          var xx = padL + k * stepX;
          var yy = padT + (h - padT - padB) * (1 - data[k] / max);
          if (k === 0) { ctx.moveTo(xx, yy); } else { ctx.lineTo(xx, yy); }
        }
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.shadowColor = accent;
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;
        for (var m = 0; m < limit; m++) {
          var px = padL + m * stepX;
          var py = padT + (h - padT - padB) * (1 - data[m] / max);
          ctx.fillStyle = accent;
          ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
        }
      }
      function animateChart() {
        chartAnim = 0;
        var t = setInterval(function () {
          chartAnim += 0.12;
          drawChart();
          if (chartAnim >= 1) { clearInterval(t); }
        }, reduced ? 1 : 26);
      }
      qa('[data-period]').forEach(function (b) {
        b.addEventListener('click', function () {
          period = b.getAttribute('data-period');
          qa('[data-period]').forEach(function (o) {
            var on = o === b;
            o.classList.toggle('is-active', on);
            o.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          var d = chartData[period];
          q('#vb-jv1-m-used').textContent = d.used;
          q('#vb-jv1-m-saved').textContent = d.saved;
          q('#vb-jv1-m-cost').textContent = d.cost;
          animateChart();
          addLog('Аналитика: период — ' + b.textContent.trim().toLowerCase());
        });
      });

      /* ---------- Камеры ---------- */
      qa('.vb-jv1__cam').forEach(function (cam) {
        cam.addEventListener('click', function () {
          var open = cam.classList.contains('is-open');
          qa('.vb-jv1__cam').forEach(function (c) { c.classList.remove('is-open'); c.setAttribute('aria-pressed', 'false'); });
          if (!open) {
            cam.classList.add('is-open');
            cam.setAttribute('aria-pressed', 'true');
            var name = q('.vb-jv1__cam-name', cam);
            toast('Развёрнут поток: ' + (name ? name.textContent : 'камера'));
            addLog('Видеопоток развёрнут');
          }
          beep(880, 0.07);
        });
      });
      q('#vb-jv1-cam-reset').addEventListener('click', function () {
        qa('.vb-jv1__cam').forEach(function (c) { c.classList.remove('is-open'); c.setAttribute('aria-pressed', 'false'); });
        toast('Сетка наблюдения сброшена в 4 потока.');
      });

      /* ---------- Дроны ---------- */
      qa('.vb-jv1__drone').forEach(function (card) {
        var name = card.getAttribute('data-drone');
        var badge = q('[data-state]', card);
        var battFill = q('[data-batt]', card);
        var battNum = q('[data-batt-num]', card);
        card.__batt = parseInt(battNum.textContent, 10) || 80;

        q('[data-act="launch"]', card).addEventListener('click', function () {
          if (card.classList.contains('is-flying')) { toast(name + ': уже в воздухе.', 'warn'); return; }
          card.classList.add('is-flying');
          badge.textContent = 'В ПОЛЁТЕ';
          badge.className = 'vb-jv1__badge vb-jv1__badge--air';
          toast(name + ': взлёт подтверждён.');
          addLog(name + ': взлёт, маршрут проложен');
          beep(640, 0.14, 'triangle');
        });
        q('[data-act="recall"]', card).addEventListener('click', function () {
          if (!card.classList.contains('is-flying')) { toast(name + ': на базе, вызывать нечего.', 'warn'); return; }
          card.classList.remove('is-flying');
          badge.textContent = 'НА БАЗЕ';
          badge.className = 'vb-jv1__badge';
          card.__batt = 100;
          battFill.style.width = '100%';
          battNum.textContent = '100%';
          toast(name + ': вернулся на базу, батарея заряжена.');
          addLog(name + ': посадка, зарядка батареи');
        });
      });
      q('#vb-jv1-drone-all').addEventListener('click', function () {
        var n = 0;
        qa('.vb-jv1__drone').forEach(function (card) {
          if (card.classList.contains('is-flying')) {
            card.classList.remove('is-flying');
            var badge = q('[data-state]', card);
            badge.textContent = 'НА БАЗЕ';
            badge.className = 'vb-jv1__badge';
            card.__batt = 100;
            q('[data-batt]', card).style.width = '100%';
            q('[data-batt-num]', card).textContent = '100%';
            n++;
          }
        });
        toast(n ? 'Все ' + n + ' дрона отозваны на базу.' : 'Весь флот уже на базе.', n ? undefined : 'warn');
        if (n) { addLog('Общий отзыв флота на базу'); }
      });
      setInterval(function () {
        qa('.vb-jv1__drone').forEach(function (card) {
          if (!card.classList.contains('is-flying')) return;
          card.__batt = Math.max(6, card.__batt - 1);
          q('[data-batt]', card).style.width = card.__batt + '%';
          q('[data-batt-num]', card).textContent = card.__batt + '%';
        });
      }, 3200);

      /* ---------- Арсенал ---------- */
      var modal = q('#vb-jv1-modal');
      var currentSuit = null;
      qa('.vb-jv1-suit').forEach(function (btn) {
        btn.addEventListener('click', function () {
          currentSuit = btn;
          q('#vb-jv1-modal-title').textContent = btn.getAttribute('data-suit');
          q('#vb-jv1-modal-ver').textContent = btn.getAttribute('data-ver');
          q('#vb-jv1-modal-power').textContent = btn.getAttribute('data-power');
          q('#vb-jv1-modal-speed').textContent = btn.getAttribute('data-speed');
          q('#vb-jv1-modal-status').textContent = btn.getAttribute('data-status');
          var act = q('#vb-jv1-modal-activate');
          var dep = btn.classList.contains('is-deployed');
          act.disabled = btn.getAttribute('data-status') !== 'Готов' && !dep;
          act.querySelector('.t-btnflex__text').textContent = dep ? 'ВЕРНУТЬ В АНГАР' : 'АКТИВИРОВАТЬ КОСТЮМ';
          modal.hidden = false;
          act.focus();
          beep(820, 0.08);
        });
      });
      function closeModal() { modal.hidden = true; }
      qa('[data-close]', modal).forEach(function (el) { el.addEventListener('click', closeModal); });
      q('#vb-jv1-modal-activate').addEventListener('click', function () {
        if (!currentSuit) return;
        var nm = currentSuit.getAttribute('data-suit');
        var dep = currentSuit.classList.toggle('is-deployed');
        var st = q('.vb-jv1-suit__st', currentSuit);
        if (dep) {
          st.textContent = 'В ПОЛЁТЕ';
          toast(nm + ': костюм активирован, шлюз открыт.');
          addLog(nm + ': активация костюма, выход из ангара', 'is-warn');
          beep(560, 0.2, 'sawtooth');
        } else {
          st.textContent = 'ГОТОВ';
          toast(nm + ': костюм возвращён в ангар.');
          addLog(nm + ': костюм в ангаре');
        }
        closeModal();
      });

      /* ---------- Оборона ---------- */
      var secBadge = q('#vb-jv1-sec-level');
      var zoneSwitches = qa('.vb-jv1-switch');
      function updateSecLevel() {
        var on = zoneSwitches.filter(function (s) { return s.classList.contains('is-on'); }).length;
        var label = 'УРОВЕНЬ: ';
        if (state.lockdown) { label += 'КРИТИЧЕСКИЙ'; }
        else if (on === 4) { label += 'МАКСИМАЛЬНЫЙ'; }
        else if (on >= 2) { label += 'ВЫСОКИЙ'; }
        else if (on === 1) { label += 'СРЕДНИЙ'; }
        else { label += 'НИЗКИЙ'; }
        secBadge.textContent = label;
      }
      zoneSwitches.forEach(function (sw) {
        sw.addEventListener('click', function () {
          var on = sw.classList.toggle('is-on');
          sw.setAttribute('aria-checked', on ? 'true' : 'false');
          var zoneName = sw.getAttribute('aria-label').replace('Охрана ', '');
          toast(zoneName + ': охрана ' + (on ? 'включена' : 'снята') + '.', on ? undefined : 'warn');
          addLog(zoneName + ': ' + (on ? 'охрана включена' : 'охрана снята'), on ? undefined : 'is-warn');
          updateSecLevel();
        });
      });
      var lockdownBtn = q('#vb-jv1-lockdown');
      lockdownBtn.addEventListener('click', function () {
        state.lockdown = !state.lockdown;
        lockdownBtn.setAttribute('aria-pressed', state.lockdown ? 'true' : 'false');
        lockdownBtn.querySelector('.t-btnflex__text').textContent = state.lockdown ? 'СНЯТЬ БЛОКИРОВКУ' : 'ТОТАЛЬНАЯ БЛОКИРОВКА';
        q('#vb-jv1-lock-hint').textContent = state.lockdown
          ? 'Все шлюзы закрыты. Снимите блокировку, чтобы вернуть штатный режим.'
          : 'Блокировка задействует все замки, шлюзы и системы ангара одновременно.';
        if (state.lockdown) {
          zoneSwitches.forEach(function (s) { s.classList.add('is-on'); s.setAttribute('aria-checked', 'true'); });
          toast('ТОТАЛЬНАЯ БЛОКИРОВКА АКТИВИРОВАНА', 'danger');
          addLog('Активирована тотальная блокировка объекта', 'is-danger');
          beep(320, 0.4, 'square');
        } else {
          toast('Блокировка снята. Штатный режим.');
          addLog('Тотальная блокировка снята');
        }
        updateSecLevel();
      });
      updateSecLevel();

      /* ---------- Аварийный режим ---------- */
      function setAlert(on) {
        state.alert = on;
        root.classList.toggle('is-alert', on);
        q('#vb-jv1-chip-alert').hidden = !on;
        if (on) {
          toast('АВАРИЙНЫЙ ПРОТОКОЛ: переключение резервных контуров.', 'danger');
          addLog('АКТИВИРОВАН АВАРИЙНЫЙ ПРОТОКОЛ', 'is-danger');
          out('ВНИМАНИЕ: аварийный протокол активен. Введите «сброс» для отмены.', 'vb-jv1__cline--err');
          beep(300, 0.5, 'square');
        } else {
          toast('Аварийный протокол сброшен. Норма.');
          addLog('Аварийный протокол сброшен');
          out('Аварийный протокол сброшен.', 'vb-jv1__cline--sys');
        }
        if (state.panel === 'analytics' || state.panel === 'reactor') { drawChart(); }
      }

      /* ---------- Плеер ---------- */
      var playerEl = q('.vb-jv1__player');
      var playBtn = q('#vb-jv1-play');
      function renderTrack() {
        q('#vb-jv1-track').textContent = TRACKS[state.track];
      }
      playBtn.addEventListener('click', function () {
        state.playing = !state.playing;
        playBtn.setAttribute('aria-pressed', state.playing ? 'true' : 'false');
        playBtn.setAttribute('aria-label', state.playing ? 'Пауза' : 'Воспроизведение');
        q('.vb-jv1-ic-play').hidden = state.playing;
        q('.vb-jv1-ic-pause').hidden = !state.playing;
        playerEl.classList.toggle('is-playing', state.playing);
        toast(state.playing ? 'Воспроизведение: ' + TRACKS[state.track] : 'Пауза.');
        addLog(state.playing ? 'Музыка: воспроизведение' : 'Музыка: пауза');
      });
      q('#vb-jv1-next').addEventListener('click', function () {
        state.track = (state.track + 1) % TRACKS.length;
        renderTrack();
        addLog('Музыка: следующий трек');
        beep(1040, 0.06);
      });
      q('#vb-jv1-prev').addEventListener('click', function () {
        state.track = (state.track - 1 + TRACKS.length) % TRACKS.length;
        renderTrack();
        addLog('Музыка: предыдущий трек');
        beep(760, 0.06);
      });
      q('#vb-jv1-volume').addEventListener('input', function () {
        addLog('Музыка: громкость ' + this.value + '%');
      });

      /* ---------- Звук интерфейса ---------- */
      var soundBtn = q('#vb-jv1-sound');
      soundBtn.addEventListener('click', function () {
        state.sound = !state.sound;
        soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
        soundBtn.setAttribute('aria-label', 'Звук интерфейса: ' + (state.sound ? 'включён' : 'выключен'));
        toast(state.sound ? 'Звуки интерфейса включены.' : 'Звуки интерфейса выключены.');
        beep(880, 0.1);
      });

      /* ---------- Голосовой ввод ---------- */
      var voiceOv = q('#vb-jv1-voice-ov');
      var voiceTimer = null;
      var VOICE = [
        { phrase: 'запусти дрон', run: function () { setPanel('drones', true); var b = q('#vb-jv1-p-drones [data-act="launch"]'); if (b) { b.click(); } } },
        { phrase: 'открой камеры', run: function () { setPanel('cameras'); } },
        { phrase: 'статус реактора', run: function () { setPanel('reactor', true); out('Реактор: ' + state.power + '%, температура контура в норме.'); } },
        { phrase: 'диагностика', run: function () { runDiag(); } },
        { phrase: 'включи аварию', run: function () { if (!state.alert) { setAlert(true); } } },
        { phrase: 'открой арсенал', run: function () { setPanel('arsenal'); } }
      ];
      q('#vb-jv1-voice').addEventListener('click', function () {
        voiceOv.hidden = false;
        q('#vb-jv1-voice-status').textContent = 'Слушаю вас…';
        q('#vb-jv1-voice-heard').textContent = '';
        beep(1100, 0.1);
        var pick = VOICE[Math.floor(Math.random() * VOICE.length)];
        voiceTimer = setTimeout(function () {
          q('#vb-jv1-voice-status').textContent = 'Команда распознана';
          q('#vb-jv1-voice-heard').textContent = '«' + pick.phrase + '»';
          addLog('Голосовая команда: «' + pick.phrase + '»');
          beep(820, 0.12);
          voiceTimer = setTimeout(function () {
            voiceOv.hidden = true;
            pick.run();
            toast('Выполнено: «' + pick.phrase + '»');
          }, reduced ? 200 : 1200);
        }, reduced ? 300 : 2000);
      });
      q('#vb-jv1-voice-cancel').addEventListener('click', function () {
        if (voiceTimer) { clearTimeout(voiceTimer); }
        voiceOv.hidden = true;
        addLog('Голосовой ввод отменён');
      });

      /* ---------- Консоль ---------- */
      var HELP = [
        'Доступные команды:',
        '  статус — сводка по системам',
        '  диагностика — полная самопроверка',
        '  запусти дрон / вызвать дронов — управление БПЛА',
        '  реактор [5-100] — задать мощность ядра',
        '  камеры / дроны / арсенал / оборона / аналитика — модули',
        '  включи свет / выключи свет — освещение лаборатории',
        '  блокировка — тотальная блокировка объекта',
        '  стелс — профиль невидимости',
        '  музыка — плейлист',
        '  авария / сброс — аварийный протокол',
        '  время — текущее время',
        '  очисти — очистить консоль'
      ];
      function runCommand(raw) {
        var cmd = raw.trim().toLowerCase();
        if (!cmd) return;
        out('› ' + raw.trim(), 'vb-jv1__cline--user');
        beep(940, 0.05);

        if (cmd === 'помощь' || cmd === 'help') { HELP.forEach(function (l) { out(l, 'vb-jv1__cline--sys'); }); return; }
        if (cmd === 'очисти' || cmd === 'clear') { outEl.innerHTML = ''; return; }
        if (cmd === 'статус' || cmd === 'status') {
          out('Мощность ядра: ' + state.power + '% · Оборона: ' + (state.lockdown ? 'блокировка' : 'штатно') + ' · Авария: ' + (state.alert ? 'АКТИВНА' : 'нет'), 'vb-jv1__cline--sys');
          addLog('Запрошен статус систем');
          return;
        }
        if (cmd.indexOf('диагност') === 0) { runDiag(); return; }
        if (cmd.indexOf('запусти дрон') === 0 || cmd === 'дрон') { setPanel('drones', true); var lb = q('#vb-jv1-p-drones [data-act="launch"]'); if (lb) { lb.click(); } return; }
        if (cmd.indexOf('вызвать дрон') === 0) { var rb = q('#vb-jv1-drone-all'); if (rb) { rb.click(); } setPanel('drones', true); return; }
        if (cmd.indexOf('реактор') === 0) {
          setPanel('reactor', true);
          var num = cmd.match(/\d+/);
          if (num) { applyPower(Number(num[0]), true); toast('Мощность ядра: ' + state.power + '%'); }
          else { out('Текущая мощность ядра: ' + state.power + '%', 'vb-jv1__cline--sys'); }
          return;
        }
        if (cmd.indexOf('камер') === 0) { setPanel('cameras'); return; }
        if (cmd.indexOf('дрон') === 0) { setPanel('drones'); return; }
        if (cmd.indexOf('арсенал') === 0 || cmd.indexOf('костюм') === 0) { setPanel('arsenal'); return; }
        if (cmd.indexOf('оборон') === 0 || cmd.indexOf('блокировк') === 0) {
          if (cmd.indexOf('блокировк') === 0) { setPanel('defense', true); lockdownBtn.click(); }
          else { setPanel('defense'); }
          return;
        }
        if (cmd.indexOf('аналит') === 0) { setPanel('analytics'); animateChart(); return; }
        if (cmd.indexOf('включи свет') === 0) { toast('Освещение лаборатории включено.'); addLog('Свет: включён'); return; }
        if (cmd.indexOf('выключи свет') === 0) { toast('Освещение лаборатории выключено.'); addLog('Свет: выключен'); return; }
        if (cmd.indexOf('стелс') === 0) { q('#vb-jv1-stealth').click(); return; }
        if (cmd.indexOf('музык') === 0) { playBtn.click(); return; }
        if (cmd.indexOf('бурст') === 0) { q('#vb-jv1-burst').click(); return; }
        if (cmd.indexOf('перезапуск') === 0 || cmd === 'перезагрузка') { q('#vb-jv1-reboot').click(); return; }
        if (cmd === 'авария' || cmd.indexOf('аварийн') === 0) { if (!state.alert) { setAlert(true); } else { out('Аварийный протокол уже активен.', 'vb-jv1__cline--err'); } return; }
        if (cmd === 'сброс' || cmd.indexOf('сброс авар') === 0) { if (state.alert) { setAlert(false); } else { out('Аварии нет, сбрасывать нечего.', 'vb-jv1__cline--sys'); } return; }
        if (cmd === 'время' || cmd === 'часы') { out('Текущее время: ' + stamp(), 'vb-jv1__cline--sys'); return; }
        if (cmd.indexOf('привет') === 0) { out('Приветствую, сэр. Слушаю вас.', 'vb-jv1__cline--sys'); return; }

        out('Команда не распознана: «' + cmd + '». Введите «помощь».', 'vb-jv1__cline--err');
        beep(240, 0.16, 'square');
      }
      q('#vb-jv1-console-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var inp = q('#vb-jv1-console-in');
        runCommand(inp.value);
        inp.value = '';
        inp.focus();
      });
      qa('.vb-jv1-chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          runCommand(chip.getAttribute('data-cmd'));
          var inp = q('#vb-jv1-console-in');
          inp.focus();
        });
      });

      /* ---------- Клавиатура ---------- */
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (!modal.hidden) { closeModal(); return; }
          if (!voiceOv.hidden) { voiceOv.hidden = true; if (voiceTimer) { clearTimeout(voiceTimer); } return; }
        }
        var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea') return;
        if (e.key === '/') { e.preventDefault(); q('#vb-jv1-console-in').focus(); }
        var map = { '1': 'reactor', '2': 'cameras', '3': 'drones', '4': 'arsenal', '5': 'defense', '6': 'analytics' };
        if (map[e.key]) { setPanel(map[e.key]); }
      });

      /* ---------- Телеметрия и фоновые события ---------- */
      var gauges = { cpu: 34, mem: 51, net: 22 };
      setInterval(function () {
        for (var k in gauges) {
          gauges[k] = Math.max(8, Math.min(96, gauges[k] + (Math.random() * 16 - 8)));
          var v = Math.round(gauges[k]);
          var fill = q('[data-gauge="' + k + '"]');
          var num = q('[data-gauge-num="' + k + '"]');
          if (fill) { fill.style.width = v + '%'; }
          if (num) { num.textContent = v + '%'; }
        }
      }, 2400);

      var AMBIENT = [
        'Спутник «Страж-9» на связи',
        'Пакет обновлений зашифрован и принят',
        'Проверка периметра: отклонений нет',
        'Сканирование эфира: чисто',
        'Резервный аккумултор: 98%',
        'Синхронизация с облачным архивом завершена',
        'Датчик сплавов в лаборатории: норма'
      ];
      setInterval(function () {
        if (state.alert) { addLog('Тревога: переключение на резервный контур', 'is-danger'); return; }
        addLog(AMBIENT[Math.floor(Math.random() * AMBIENT.length)]);
      }, 9000);
      addLog('Периметр под охраной');
      addLog('Спутниковый линк: стабилен');

      /* ---------- Цикл отрисовки ---------- */
      function loop() {
        phase += reduced ? 0 : 0.06;
        if (state.panel === 'reactor' && !q('#vb-jv1-p-reactor').hidden) { drawWave(); }
        requestAnimationFrame(loop);
      }
      if (reduced) { drawWave(); } else { requestAnimationFrame(loop); }
      window.addEventListener('resize', function () { sizeWave(); drawChart(); });
      sizeWave();
    })();
  </script>
</section>
