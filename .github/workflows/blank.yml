<section class="vb-jv1" id="vb-jv1-root" data-section-name="Пульт управления" data-vibeblock-unique-section="yes">

  <!-- Экран загрузки -->
  <div class="vb-jv1__boot" id="vb-jv1-boot" role="status" aria-live="polite">
    <div class="vb-jv1__boot-inner">
      <svg class="vb-jv1__boot-icon" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
        <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
        <polygon points="50,26 71,62 29,62" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="50" cy="50" r="10" fill="currentColor" opacity=".85"/>
      </svg>
      <p class="vb-jv1__boot-title">J.A.R.V.I.S.</p>
      <ul class="vb-jv1__boot-lines" id="vb-jv1-boot-lines"></ul>
      <div class="vb-jv1__boot-bar"><span id="vb-jv1-boot-bar"></span></div>
      <button class="vb-jv1-btn vb-jv1-btn--ghost vb-jv1__boot-skip" id="vb-jv1-boot-skip" type="button">ПРОПУСТИТЬ ЗАГРУЗКУ</button>
    </div>
  </div>

  <!-- Шапка -->
  <header class="vb-jv1__top">
    <div class="vb-jv1__brand">
      <svg class="vb-jv1__brand-icon" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 3"/>
        <circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <polygon points="24,13 34,31 14,31" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="24" cy="24" r="5" fill="currentColor"/>
      </svg>
      <div class="vb-jv1__brand-text">
        <p class="vb-jv1__brand-name">STARK INDUSTRIES · JARVIS</p>
        <p class="vb-jv1__brand-sub">Лаборатория №3 · протокол v4.2</p>
      </div>
    </div>

    <div class="vb-jv1__top-status" aria-label="Сводка состояния">
      <span class="vb-jv1__chip" id="vb-jv1-chip-core">ЯДРО 100%</span>
      <span class="vb-jv1__chip">СЕТЬ ЗАЩИЩЕНА</span>
      <span class="vb-jv1__chip vb-jv1__chip--alert" id="vb-jv1-chip-alert" hidden>АВАРИЙНЫЙ ПРОТОКОЛ</span>
    </div>

    <div class="vb-jv1__top-right">
      <time class="vb-jv1__clock" id="vb-jv1-clock">00:00:00</time>
      <button class="vb-jv1-iconbtn" id="vb-jv1-sound" type="button" aria-pressed="false" aria-label="Звук интерфейса: выключен">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path class="vb-jv1-sound-wave" d="M16.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
      </button>
      <button class="t-btnflex t-btnflex_md vb-jv1-btn vb-jv1-btn--voice" id="vb-jv1-voice" type="button">
        <span class="t-btnflex__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <span class="t-btnflex__text">ГОЛОСОВОЙ ВВОД</span>
      </button>
    </div>
  </header>

  <!-- Навигация по модулям -->
  <nav class="vb-jv1__nav" aria-label="Модули системы">
    <button class="vb-jv1__nav-btn is-active" type="button" data-panel="reactor" aria-pressed="true" title="Реактор">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
      <span class="vb-jv1__nav-label">Реактор</span>
    </button>
    <button class="vb-jv1__nav-btn" type="button" data-panel="cameras" aria-pressed="false" title="Камеры">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3v9l-6-3z"/><circle cx="9" cy="12" r="2.4"/></svg>
      <span class="vb-jv1__nav-label">Камеры</span>
    </button>
    <button class="vb-jv1__nav-btn" type="button" data-panel="drones" aria-pressed="false" title="Дроны">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M9.6 9.6L5.5 5.5M14.4 9.6l4.1-4.1M9.6 14.4l-4.1 4.1M14.4 14.4l4.1 4.1"/><circle cx="4" cy="4" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="20" r="2"/></svg>
      <span class="vb-jv1__nav-label">Дроны</span>
    </button>
    <button class="vb-jv1__nav-btn" type="button" data-panel="arsenal" aria-pressed="false" title="Арсенал">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2.5c4.5 0 7.5 3 7.5 7.5v4c0 4-3.4 7-7.5 7.5-4.1-.5-7.5-3.5-7.5-7.5v-4c0-4.5 3-7.5 7.5-7.5z"/><path d="M8.5 10.5h2.2M13.3 10.5h2.2M10 15.5h4"/></svg>
      <span class="vb-jv1__nav-label">Арсенал</span>
    </button>
    <button class="vb-jv1__nav-btn" type="button" data-panel="defense" aria-pressed="false" title="Оборона">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2.6l8 3v6.2c0 5-3.6 8.4-8 9.6-4.4-1.2-8-4.6-8-9.6V5.6z"/><path d="M8.8 12l2.4 2.4 4-4.6"/></svg>
      <span class="vb-jv1__nav-label">Оборона</span>
    </button>
    <button class="vb-jv1__nav-btn" type="button" data-panel="analytics" aria-pressed="false" title="Аналитика">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 20.5h17"/><polyline points="4,16 9,10 13,13 20,4.5"/><circle cx="9" cy="10" r="1.4"/><circle cx="13" cy="13" r="1.4"/></svg>
      <span class="vb-jv1__nav-label">Аналитика</span>
    </button>
  </nav>

  <!-- Рабочая область -->
  <main class="vb-jv1__stage">

    <!-- Реактор -->
    <section class="vb-jv1__panel is-active" id="vb-jv1-p-reactor" data-section-name="Модуль реактора" aria-labelledby="vb-jv1-h-reactor">
      <div class="vb-jv1__panel-head">
        <h2 class="vb-jv1__panel-title" id="vb-jv1-h-reactor">ДУГОВОЙ РЕАКТОР · МАРК VII</h2>
        <div class="vb-jv1__panel-tools">
          <button class="vb-jv1-btn vb-jv1-btn--ghost" id="vb-jv1-stealth" type="button" aria-pressed="false">СТЕЛС-РЕЖИМ</button>
          <button class="vb-jv1-btn vb-jv1-btn--ghost" id="vb-jv1-diag" type="button">САМОДИАГНОСТИКА</button>
        </div>
      </div>

      <div class="vb-jv1__reactor-wrap">
        <div class="vb-jv1__reactor" id="vb-jv1-reactor-visual" aria-hidden="true">
          <svg viewBox="0 0 220 220">
            <g class="vb-jv1__ring vb-jv1__ring--a">
              <circle cx="110" cy="110" r="102" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="26 14"/>
            </g>
            <g class="vb-jv1__ring vb-jv1__ring--b">
              <circle cx="110" cy="110" r="86" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="80 20"/>
            </g>
            <g class="vb-jv1__ring vb-jv1__ring--c">
              <circle cx="110" cy="110" r="70" fill="none" stroke="currentColor" stroke-width="1"/>
              <circle cx="110" cy="40" r="4" fill="currentColor"/>
              <circle cx="110" cy="180" r="4" fill="currentColor"/>
              <circle cx="40" cy="110" r="4" fill="currentColor"/>
              <circle cx="180" cy="110" r="4" fill="currentColor"/>
            </g>
            <g class="vb-jv1__ring vb-jv1__ring--d">
              <polygon points="110,52 160,140 60,140" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <polygon points="110,168 60,80 160,80" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/>
            </g>
            <circle class="vb-jv1__core-glow" cx="110" cy="110" r="34" fill="currentColor" opacity=".16"/>
            <circle class="vb-jv1__core" cx="110" cy="110" r="22" fill="currentColor"/>
          </svg>
        </div>

        <div class="vb-jv1__reactor-side">
          <p class="vb-jv1__power-value"><span id="vb-jv1-power-num">78</span><span class="vb-jv1__power-unit">%</span></p>
          <p class="vb-jv1__power-cap">Выход энергии</p>
          <label class="vb-jv1__slider-row" for="vb-jv1-power">
            <span class="vb-jv1__slider-name">Управление питанием</span>
            <input class="vb-jv1__slider" id="vb-jv1-power" type="range" min="5" max="100" value="78" aria-label="Мощность реактора, процентов">
          </label>
          <dl class="vb-jv1__stats">
            <div class="vb-jv1__stat"><dt>Температура контура</dt><dd id="vb-jv1-stat-temp">312 K</dd></div>
            <div class="vb-jv1__stat"><dt>Поток нейтрино</dt><dd id="vb-jv1-stat-neutrino">9.4 ГГц</dd></div>
            <div class="vb-jv1__stat"><dt>Ёмкость палладия</dt><dd id="vb-jv1-stat-palladium">96%</dd></div>
          </dl>
        </div>
      </div>

      <div class="vb-jv1__reactor-foot">
        <div class="vb-jv1__actions">
          <button class="t-btnflex t-btnflex_md vb-jv1-btn" id="vb-jv1-reboot" type="button"><span class="t-btnflex__text">ПЕРЕЗАПУСТИТЬ ЯДРО</span></button>
          <button class="vb-jv1-btn vb-jv1-btn--ghost" id="vb-jv1-turbine" type="button">ТЕСТ ТУРБИНЫ</button>
          <button class="vb-jv1-btn vb-jv1-btn--warn" id="vb-jv1-burst" type="button" aria-pressed="false">БУРСТ-РЕЖИМ</button>
        </div>
        <div class="vb-jv1__scope">
          <p class="vb-jv1__scope-label">Осциллограф выхода</p>
          <canvas class="vb-jv1__canvas" id="vb-jv1-wave" height="90"></canvas>
        </div>
      </div>
    </section>

    <!-- Камеры -->
    <section class="vb-jv1__panel" id="vb-jv1-p-cameras" data-section-name="Видеонаблюдение" aria-labelledby="vb-jv1-h-cameras" hidden>
      <div class="vb-jv1__panel-head">
        <h2 class="vb-jv1__panel-title" id="vb-jv1-h-cameras">СЕТЬ ВИДЕОНАБЛЮДЕНИЯ · 4 ПОТОКА</h2>
        <div class="vb-jv1__panel-tools">
          <button class="vb-jv1-btn vb-jv1-btn--ghost" id="vb-jv1-cam-reset" type="button">СБРОСИТЬ ВИД</button>
        </div>
      </div>
      <div class="vb-jv1__cams">
        <button class="vb-jv1__cam" type="button" aria-pressed="false">
          <img src="https://static.tildacdn.com/tild3034-3863-4138-b365-653939333638/photo-1679089391720-.jpg" alt="Камера 01: улица у штаб-квартиры ночью" loading="lazy">
          <span class="vb-jv1__cam-meta"><span class="vb-jv1__cam-name">КАМ-01 · ПЕРИМЕТР</span><span class="vb-jv1__cam-time">00:00:00</span></span>
          <span class="vb-jv1__cam-rec" aria-hidden="true">REC</span>
        </button>
        <button class="vb-jv1__cam" type="button" aria-pressed="false">
          <img src="https://static.tildacdn.com/tild3239-3861-4461-b333-363031333733/photo-1616996691748-.jpg" alt="Камера 02: лаборатория" loading="lazy">
          <span class="vb-jv1__cam-meta"><span class="vb-jv1__cam-name">КАМ-02 · ЛАБОРАТОРИЯ</span><span class="vb-jv1__cam-time">00:00:00</span></span>
          <span class="vb-jv1__cam-rec" aria-hidden="true">REC</span>
        </button>
        <button class="vb-jv1__cam" type="button" aria-pressed="false">
          <img src="https://static.tildacdn.com/tild3832-3566-4530-b837-373163393235/photo-1777918034581-.jpg" alt="Камера 03: вид с дрона над городом" loading="lazy">
          <span class="vb-jv1__cam-meta"><span class="vb-jv1__cam-name">КАМ-03 · ДРОН «СТРАЖ»</span><span class="vb-jv1__cam-time">00:00:00</span></span>
          <span class="vb-jv1__cam-rec" aria-hidden="true">REC</span>
        </button>
        <button class="vb-jv1__cam" type="button" aria-pressed="false">
          <img src="https://static.tildacdn.com/tild3037-3962-4331-b434-646230373032/photo-1446776899648-.jpg" alt="Камера 04: спутниковый снимок города" loading="lazy">
          <span class="vb-jv1__cam-meta"><span class="vb-jv1__cam-name">КАМ-04 · СПУТНИК</span><span class="vb-jv1__cam-time">00:00:00</span></span>
          <span class="vb-jv1__cam-rec" aria-hidden="true">REC</span>
        </button>
      </div>
      <p class="vb-jv1__hint">Нажмите на поток, чтобы развернуть его на весь блок.</p>
    </section>

    <!-- Дроны -->
    <section class="vb-jv1__panel" id="vb-jv1-p-drones" data-section-name="Управление дронами" aria-labelledby="vb-jv1-h-drones" hidden>
      <div class="vb-jv1__panel-head">
        <h2 class="vb-jv1__panel-title" id="vb-jv1-h-drones">БПЛА · АКТИВНЫЙ ФЛОТ</h2>
        <div class="vb-jv1__panel-tools">
          <button class="vb-jv1-btn vb-jv1-btn--ghost" id="vb-jv1-drone-all" type="button">ВЫЗВАТЬ ВСЁ НА БАЗУ</button>
        </div>
      </div>
      <div class="vb-jv1__drones">
        <article class="vb-jv1__drone" data-drone="СТРАЖ-01">
          <header class="vb-jv1__drone-head"><h3 class="vb-jv1__drone-name">СТРАЖ-01</h3><span class="vb-jv1__badge" data-state>НА БАЗЕ</span></header>
          <p class="vb-jv1__drone-task">Задача: патрулирование периметра</p>
          <div class="vb-jv1__batt"><span class="vb-jv1__batt-label">Батарея</span><span class="vb-jv1__batt-track"><span class="vb-jv1__batt-fill" data-batt style="width:92%"></span></span><span class="vb-jv1__batt-num" data-batt-num>92%</span></div>
          <div class="vb-jv1__drone-actions">
            <button class="t-btnflex t-btnflex_sm vb-jv1-btn" type="button" data-act="launch"><span class="t-btnflex__text">ЗАПУСК</span></button>
            <button class="vb-jv1-btn vb-jv1-btn--ghost" type="button" data-act="recall">ВЫЗВАТЬ</button>
          </div>
        </article>
        <article class="vb-jv1__drone" data-drone="РАЗВЕДЧИК-02">
          <header class="vb-jv1__drone-head"><h3 class="vb-jv1__drone-name">РАЗВЕДЧИК-02</h3><span class="vb-jv1__badge" data-state>НА БАЗЕ</span></header>
          <p class="vb-jv1__drone-task">Задача: аэрофотосъёмка квартала</p>
          <div class="vb-jv1__batt"><span class="vb-jv1__batt-label">Батарея</span><span class="vb-jv1__batt-track"><span class="vb-jv1__batt-fill" data-batt style="width:74%"></span></span><span class="vb-jv1__batt-num" data-batt-num>74%</span></div>
          <div class="vb-jv1__drone-actions">
            <button class="t-btnflex t-btnflex_sm vb-jv1-btn" type="button" data-act="launch"><span class="t-btnflex__text">ЗАПУСК</span></button>
            <button class="vb-jv1-btn vb-jv1-btn--ghost" type="button" data-act="recall">ВЫЗВАТЬ</button>
          </div>
        </article>
        <article class="vb-jv1__drone" data-drone="ГРУЗОВИК-03">
          <header class="vb-jv1__drone-head"><h3 class="vb-jv1__drone-name">ГРУЗОВИК-03</h3><span class="vb-jv1__badge" data-state>НА БАЗЕ</span></header>
          <p class="vb-jv1__drone-task">Задача: доставка модулей в ангар</p>
          <div class="vb-jv1__batt"><span class="vb-jv1__batt-label">Батарея</span><span class="vb-jv1__batt-track"><span class="vb-jv1__batt-fill" data-batt style="width:58%"></span></span><span class="vb-jv1__batt-num" data-batt-num>58%</span></div>
          <div class="vb-jv1__drone-actions">
            <button class="t-btnflex t-btnflex_sm vb-jv1-btn" type="button" data-act="launch"><span class="t-btnflex__text">ЗАПУСК</span></button>
            <button class="vb-jv1-btn vb-jv1-btn--ghost" type="button" data-act="recall">ВЫЗВАТЬ</button>
          </div>
        </article>
      </div>
    </section>

    <!-- Арсенал -->
    <section class="vb-jv1__panel" id="vb-jv1-p-arsenal" data-section-name="Арсенал костюмов" aria-labelledby="vb-jv1-h-arsenal" hidden>
      <div class="vb-jv1__panel-head">
        <h2 class="vb-jv1__panel-title" id="vb-jv1-h-arsenal">АНГАР · КОСТЮМЫ</h2>
        <div class="vb-jv1__panel-tools">
          <span class="vb-jv1__badge vb-jv1__badge--info" id="vb-jv1-suit-count">6 ЕД. НА ХРАНЕНИИ</span>
        </div>
      </div>
      <div class="vb-jv1__suits" id="vb-jv1-suits">
        <button class="vb-jv1-suit" type="button" data-suit="ГОРИЗОНТ" data-ver="MK-01" data-power="Реактор: палладиевый, 3 ГВт" data-speed="Скорость: 1.8 Маха" data-status="Готов">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M24 5c9 0 15 6 15 15v7c0 9-7 14-15 16-8-2-15-7-15-16v-7C9 11 15 5 24 5z"/><path d="M16 21h5M27 21h5M20 32h8"/></svg>
          <span class="vb-jv1-suit__name">ГОРИЗОНТ</span><span class="vb-jv1-suit__ver">MK-01</span><span class="vb-jv1-badge vb-jv1-suit__st">ГОТОВ</span>
        </button>
        <button class="vb-jv1-suit" type="button" data-suit="ВУЛКАН" data-ver="MK-02" data-power="Реактор: дуговой, 8 ГВт" data-speed="Скорость: 2.6 Маха" data-status="Готов">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M24 5c9 0 15 6 15 15v7c0 9-7 14-15 16-8-2-15-7-15-16v-7C9 11 15 5 24 5z"/><path d="M16 21h5M27 21h5M20 32h8"/></svg>
          <span class="vb-jv1-suit__name">ВУЛКАН</span><span class="vb-jv1-suit__ver">MK-02</span><span class="vb-jv1-badge vb-jv1-suit__st">ГОТОВ</span>
        </button>
        <button class="vb-jv1-suit" type="button" data-suit="НАРВАЛЬ" data-ver="MK-03" data-power="Реактор: экспериментальный, 12 ГВт" data-speed="Скорость: 3.4 Маха" data-status="ТО">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M24 5c9 0 15 6 15 15v7c0 9-7 14-15 16-8-2-15-7-15-16v-7C9 11 15 5 24 5z"/><path d="M16 21h5M27 21h5M20 32h8"/></svg>
          <span class="vb-jv1-suit__name">НАРВАЛЬ</span><span class="vb-jv1-suit__ver">MK-03</span><span class="vb-jv1-badge vb-jv1-badge--warn vb-jv1-suit__st">ТО</span>
        </button>
        <button class="vb-jv1-suit" type="button" data-suit="ВИХРЬ" data-ver="MK-04" data-power="Реактор: дуговой, 10 ГВт" data-speed="Скорость: 3.0 Маха" data-status="Готов">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M24 5c9 0 15 6 15 15v7c0 9-7 14-15 16-8-2-15-7-15-16v-7C9 11 15 5 24 5z"/><path d="M16 21h5M27 21h5M20 32h8"/></svg>
